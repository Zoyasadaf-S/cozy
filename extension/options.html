<!doctype html>
<meta charset="utf-8"><title>Cozy Tab Controller</title>
<style>body{font:16px system-ui;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5}button{font:inherit;padding:8px 14px}</style>
<h1>Cozy Tab Controller</h1>
<p>By default Cozy can only touch YouTube tabs and open/switch/close tabs. To let it <b>summarise or read a page aloud</b> and
<b>scroll</b> the page you are looking at, grant access to all sites. You can revoke it here at any time.</p>
<p id="state"></p><button id="grant">Allow reading pages</button> <button id="revoke">Revoke</button>
<script src="options.js"></script>
